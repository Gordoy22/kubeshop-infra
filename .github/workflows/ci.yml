# =============================================================================
# 0 · CI - VALIDAÇÃO DO CÓDIGO DE INFRAESTRUTURA (automático a cada push/PR)
# Não acessa a nuvem: formata/valida Terraform, valida Ansible, lint dos
# workflows e dos scripts, e procura segredos acidentalmente versionados.
# =============================================================================
name: "0 · CI - Validação (Terraform, Ansible, workflows, segredos)"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform
      - name: terraform validate (global e environment)
        run: |
          for S in global environment; do
            terraform -chdir=terraform/$S init -backend=false -input=false >/dev/null
            terraform -chdir=terraform/$S validate
          done

  ansible:
    name: Ansible syntax-check + lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar Ansible e ansible-lint
        run: |
          python -m pip install --quiet "ansible-core>=2.18,<2.19" "ansible-lint>=24,<26"
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      - name: syntax-check de todos os playbooks
        working-directory: ansible
        run: |
          cp inventory/hosts.example.yml inventory/hosts.yml
          for P in playbook.yml playbooks/*.yml; do
            echo "== $P"; ansible-playbook "$P" --syntax-check
          done
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint playbook.yml playbooks/ roles/

  workflows-scripts:
    name: actionlint + shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck dos scripts
        run: |
          shellcheck -S warning scripts/*.sh ansible/roles/backup/files/kubeshop-backup ansible/roles/backup/files/kubeshop-restore
      - name: actionlint dos workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --redact --verbose --exit-code 1
