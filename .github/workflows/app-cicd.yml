# =============================================================================
# 1 · CI/CD DA APLICAÇÃO (fluxo da Zibiska Korp)
# Testa e constrói as imagens do KubeShop SEM ALTERAR o código/visual original
# (usa os Dockerfiles do próprio repositório da aplicação), publica no GHCR e,
# opcionalmente, implanta a nova tag no ambiente (somente contêineres).
# Ponto de integração com a infraestrutura: imagem ghcr.io/<owner>/kubeshop-{api,frontend}:<tag>
# =============================================================================
name: "1 · App - CI/CD (build e publicação das imagens)"

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Versão do código do KubeShop (commit/branch/tag do repositório da aplicação)"
        type: string
        default: ee30950799494e789d586369fb194e815b238691
      image_tag:
        description: "Tag das imagens a publicar (ex.: 1.0.0, 1.1.0)"
        type: string
        default: "1.0.0"
      deploy_environment:
        description: "Implantar a nova tag em qual ambiente? (none = só publicar)"
        type: choice
        options: [none, dev, homolog, prod]
        default: none
  workflow_call:
    inputs:
      app_ref:
        type: string
        default: ee30950799494e789d586369fb194e815b238691
      image_tag:
        type: string
        default: "1.0.0"
      deploy_environment:
        type: string
        default: none

permissions:
  contents: read
  packages: write

env:
  APP_REPOSITORY: ${{ vars.APP_REPOSITORY || 'LaercioMLB/kube-shop-v2' }}

jobs:
  test:
    name: Testes da aplicação (API + interface)
    runs-on: ubuntu-24.04
    steps:
      - name: Validar parâmetros
        env:
          TAG: ${{ inputs.image_tag }}
          REF: ${{ inputs.app_ref }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::image_tag inválida"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::app_ref inválida"; exit 1; }

      - name: Obter código do KubeShop (repositório da aplicação)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ inputs.app_ref }}

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Executar testes da API e da interface
        run: npm test

  build:
    name: Build e publicação (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: apps/backend/Dockerfile
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Obter código do KubeShop
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ inputs.app_ref }}

      - name: Nome da imagem
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubeshop-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem (Dockerfile original, sem alterações)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.app_ref }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.title=kubeshop-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Registrar imagem publicada
        run: |
          echo "### Imagem publicada: \`${{ steps.img.outputs.name }}:${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Código: \`${APP_REPOSITORY}@${{ inputs.app_ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Implantar tag no ambiente
    needs: build
    if: inputs.deploy_environment != 'none' && inputs.deploy_environment != ''
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/ops.yml
    with:
      environment: ${{ inputs.deploy_environment }}
      action: deploy-app
      docker_tag: ${{ inputs.image_tag }}
    secrets: inherit
